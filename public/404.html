<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Smart Learning Plus</title>
    <script>
      // GitHub Pages SPA redirect trick
      // When a direct URL like /hard-spark-28 is hit, GitHub Pages serves this 404.html.
      // We save the full intended URL to sessionStorage, then redirect to the root.
      // The root index.html picks it up and restores it via history.replaceState.
      var l = window.location;
      sessionStorage.setItem('spa_redirect', l.pathname + l.search + l.hash);
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
    </script>
  </head>
  <body></body>
</html>
